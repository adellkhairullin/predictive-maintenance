# Непрерывная интеграция: запускается при каждой отправке в main, для pull request и вручную.
#   tests  — ETL и все тесты (включая интеграционные с PostgreSQL), покрытие не ниже 60%
#   docker — сборка образа, запуск docker compose, проверка API и тесты внутри Docker
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ETL и тесты (Python 3.12, PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pdm
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: ci_only_password   # одноразовая база внутри CI, не секрет
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: pdm
      PGUSER: pdm
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей (как в Docker-образе + тесты)
        run: |
          python -m pip install -r requirements-runtime.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.1.0 httpx==0.28.1

      - name: ETL — загрузка и построение слоёв
        run: python -m src.etl_pipeline

      - name: Тесты с покрытием
        run: python -m pytest -v -rs --cov=src --cov=api --cov-report=term --cov-fail-under=60

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Версии Docker
        run: docker --version && docker compose version

      - name: Файл .env для CI
        run: |
          cp .env.example .env
          sed -i 's/^PGPASSWORD=.*/PGPASSWORD=ci_only_password/' .env

      - name: Сборка и запуск (postgres -> etl -> api)
        run: docker compose up --build -d

      - name: Ожидание готовности API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health; then echo; echo "API готов через $((i*2)) с"; exit 0; fi
            sleep 2
          done
          echo "API не ответил за 180 с"; docker compose ps -a; exit 1

      - name: ETL завершился успешно
        run: |
          docker compose ps -a
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq etl)")
          echo "Код завершения etl: $code"
          docker compose logs etl | tail -n 15
          test "$code" = "0"

      - name: Проверка API
        run: |
          health=$(curl -fsS http://localhost:8000/health)
          echo "$health"
          echo "$health" | jq -e '.status == "ok" and .model_version == "v2" and .prediction_log == "db"'
          body='{"unit_id":1,"cycle":1,"s_2":641.82,"s_3":1589.7,"s_4":1400.6,"s_7":554.36,"s_8":2388.06,
                 "s_9":9046.19,"s_11":47.47,"s_12":521.66,"s_13":2388.02,"s_14":8138.62,"s_15":8.4195,
                 "s_17":392,"s_20":39.06,"s_21":23.419}'
          resp=$(curl -fsS -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d "$body")
          echo "$resp"
          echo "$resp" | jq -e '.probability >= 0 and .probability <= 1 and (.warnings | index("short_history"))'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
                 -H 'Content-Type: application/json' -d "$body")
          echo "Повтор того же цикла -> HTTP $code (ожидается 409)"
          test "$code" = "409"

      - name: Журнал предсказаний записан в PostgreSQL
        run: |
          sleep 2   # журнал пишется пачками раз в секунду
          n=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
              "SELECT count(*) FROM monitoring.predictions WHERE unit_id = 1")
          echo "Записей в monitoring.predictions: $n"
          test "$n" -ge 1

      - name: Тесты внутри Docker
        run: docker compose --profile test run --rm tests

      - name: Журналы контейнеров (при ошибке)
        if: failure()
        run: docker compose logs --no-color

      - name: Остановка
        if: always()
        run: docker compose --profile test down -v
