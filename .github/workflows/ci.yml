# Непрерывная интеграция: запускается при каждой отправке в main, для pull request и вручную.
#   tests  — ETL и все тесты (включая интеграционные с PostgreSQL), покрытие не ниже 60%
#   docker — сборка образа, запуск docker compose, проверка API и тесты внутри Docker
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ETL и тесты (Python 3.12, PostgreSQL 17, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pdm
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: ci_only_password   # одноразовая база внутри CI, не секрет
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: pdm
      PGUSER: pdm
      PGPASSWORD: ci_only_password
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей (как в Docker-образе + тесты)
        run: |
          python -m pip install -r requirements-runtime.txt
          python -m pip install pytest==9.2.0 pytest-cov==7.1.0 fakeredis==2.40.0

      - name: ETL — загрузка и построение слоёв
        run: python -m src.etl_pipeline

      - name: Материализация признаков в Redis
        run: |
          python -m src.feature_store.materialize --dataset test --store redis
          python -c "import redis; n = redis.Redis().scard('pdm:engines'); print('двигателей в Redis:', n); assert n == 100"

      - name: Тесты с покрытием
        run: python -m pytest -v -rs --cov=src --cov=api --cov=streaming --cov-report=term --cov-fail-under=60

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Версии Docker
        run: docker --version && docker compose version

      - name: Файл .env для CI
        run: |
          cp .env.example .env
          sed -i 's/^PGPASSWORD=.*/PGPASSWORD=ci_only_password/' .env

      - name: Сборка и запуск (postgres, redis, kafka -> etl -> feature-sync -> api, consumer)
        run: docker compose up --build -d

      - name: Ожидание готовности API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health; then echo; echo "API готов через $((i*2)) с"; exit 0; fi
            sleep 2
          done
          echo "API не ответил за 180 с"; docker compose ps -a; exit 1

      - name: ETL и материализация завершились успешно
        run: |
          docker compose ps -a
          for svc in etl feature-sync; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq $svc)")
            echo "Код завершения $svc: $code"
            docker compose logs $svc | tail -n 12
            test "$code" = "0"
          done

      - name: Проверка API
        run: |
          health=$(curl -fsS http://localhost:8000/health)
          echo "$health"
          echo "$health" | jq -e '.status == "ok" and .model_version == "v2" and .prediction_log == "db" and .online_store == "redis" and .engines_tracked == 100'
          body='{"unit_id":900001,"cycle":1,"s_2":641.82,"s_3":1589.7,"s_4":1400.6,"s_7":554.36,"s_8":2388.06,
                 "s_9":9046.19,"s_11":47.47,"s_12":521.66,"s_13":2388.02,"s_14":8138.62,"s_15":8.4195,
                 "s_17":392,"s_20":39.06,"s_21":23.419}'
          resp=$(curl -fsS -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d "$body")
          echo "$resp"
          echo "$resp" | jq -e '.probability >= 0 and .probability <= 1 and (.warnings | index("short_history"))'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
                 -H 'Content-Type: application/json' -d "$body")
          echo "Повтор того же цикла -> HTTP $code (ожидается 409)"
          test "$code" = "409"

      - name: Feature Store — продолжение прогноза после материализации и хранение в Redis
        run: |
          # тестовый двигатель 34 материализован из PostgreSQL: признаки есть, следующий цикл принимается
          f=$(curl -fsS http://localhost:8000/engines/34/features)
          echo "$f" | jq '{cycle, source, feature_set_version, n_features: (.features | length)}'
          echo "$f" | jq -e '.source == "offline:test" and (.features | length) == 71'
          next=$(( $(echo "$f" | jq '.cycle') + 1 ))
          body=$(echo "$f" | jq -c --argjson c "$next" \
            '{unit_id: 34, cycle: $c} + (.features | with_entries(select(.key | test("^s_[0-9]+$"))))')
          resp=$(curl -fsS -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d "$body")
          echo "$resp"
          echo "$resp" | jq -e '.history_cycles == 30 and (.warnings | index("short_history") | not)'
          curl -fsS http://localhost:8000/engines/34/features | jq -e --argjson c "$next" '.source == "online" and .cycle == $c'
          # история хранится в Redis: после перезапуска API тот же цикл уже считается обработанным
          docker compose restart api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break; sleep 2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
                 -H 'Content-Type: application/json' -d "$body")
          echo "После перезапуска API повтор цикла $next -> HTTP $code (ожидается 409)"
          test "$code" = "409"
          docker compose exec -T redis redis-cli --scan --pattern 'pdm:engine:34:*' | sort

      - name: Kafka — producer -> consumer -> PostgreSQL, отбраковка, фиксация смещений
        run: |
          psql() { docker compose exec -T postgres psql -U pdm -d pdm -tAc "$1"; }
          wait_count() {   # ждать, пока запрос $1 не вернёт значение $2 (до 180 с)
            for i in $(seq 1 90); do
              n=$(psql "$1"); [ "$n" = "$2" ] && { echo "  $n (через $((i*2)) с)"; return 0; }; sleep 2
            done
            echo "  получено $n, ожидалось $2"; docker compose logs consumer | tail -n 40; return 1
          }
          # распределённые потребители: два экземпляра consumer в одной группе pdm-consumer
          docker compose up -d --no-deps --no-recreate --scale consumer=2 consumer
          sleep 10
          docker compose ps consumer
          out=$(docker compose --profile stream run --rm producer --units 1-5 --unit-offset 5000 --bad-messages 3 | tail -n 1)
          echo "producer: $out"
          echo "$out" | jq -e '.source == "db" and .failed == 0 and .delivered == .sent'
          echo "::notice title=Kafka producer::источник $(echo "$out" | jq -r .source), доставлено $(echo "$out" | jq .delivered) из $(echo "$out" | jq .sent), по разделам $(echo "$out" | jq -c .partitions)"
          valid=$(echo "$out" | jq .valid)
          echo "Показания в raw (dataset=stream):"
          wait_count "SELECT count(*) FROM raw.sensor_readings WHERE dataset='stream' AND unit_id BETWEEN 5001 AND 5005" "$valid"
          echo "Отбракованные сообщения:"
          wait_count "SELECT count(*) FROM raw.stream_rejects" "3"
          psql "SELECT kafka_partition, kafka_offset, left(error, 70) FROM raw.stream_rejects ORDER BY id"
          echo "Прогнозы из потока в monitoring.predictions:"
          wait_count "SELECT count(*) FROM monitoring.predictions WHERE source='kafka' AND unit_id BETWEEN 5001 AND 5005" "$valid"
          echo "Смещения группы pdm-consumer (LAG должен быть 0):"
          sleep 3
          docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 \
            --describe --group pdm-consumer | tee /tmp/groups.txt
          awk 'NR>1 && $6 ~ /^[0-9]+$/ {lag += $6} END {print "суммарный LAG:", lag+0; exit (lag+0 != 0)}' /tmp/groups.txt
          members=$(awk '$3 ~ /^[0-9]+$/ && $7 != "-" {print $7}' /tmp/groups.txt | sort -u | wc -l)
          echo "Экземпляров consumer, получивших разделы: $members (ожидается 2)"
          test "$members" -eq 2
          echo "::notice title=Kafka consumer group::2 экземпляра consumer в группе pdm-consumer делят 3 раздела; LAG = 0 после обработки"

      - name: Kafka — перезапуск consumer не создаёт дублей
        run: |
          before=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
                   "SELECT count(*) FROM raw.sensor_readings WHERE dataset='stream'")
          docker compose restart consumer
          sleep 20
          after=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
                  "SELECT count(*) FROM raw.sensor_readings WHERE dataset='stream'")
          echo "строк stream до перезапуска: $before, после: $after"
          test "$before" = "$after"

      - name: Kafka — пропускная способность (все 100 тестовых двигателей)
        run: |
          # дождаться, пока оба экземпляра consumer после перезапуска снова получат разделы
          for i in $(seq 1 30); do
            members=$(docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh \
              --bootstrap-server localhost:9092 --describe --group pdm-consumer 2>/dev/null \
              | awk '$3 ~ /^[0-9]+$/ && $7 != "-" {print $7}' | sort -u | wc -l)
            [ "$members" -eq 2 ] && { echo "в группе 2 экземпляра (через $((i*2)) с)"; break; }; sleep 2
          done
          out=$(docker compose --profile stream run --rm producer --unit-offset 7000 | tail -n 1)
          echo "producer: $out"
          valid=$(echo "$out" | jq .valid)
          for i in $(seq 1 150); do
            n=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
                "SELECT count(*) FROM raw.sensor_readings WHERE dataset='stream' AND unit_id BETWEEN 7001 AND 7100")
            [ "$n" = "$valid" ] && break; sleep 2
          done
          echo "записано в raw $n из $valid"
          test "$n" = "$valid"
          # прогноз пишется после записи показаний — дождаться и прогнозов, иначе последние пачки не учтутся
          for i in $(seq 1 60); do
            np=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
                 "SELECT count(*) FROM monitoring.predictions WHERE source='kafka' AND unit_id BETWEEN 7001 AND 7100")
            [ "$np" = "$valid" ] && break; sleep 2
          done
          echo "прогнозов $np из $valid"
          test "$np" = "$valid"
          docker compose exec -T postgres psql -U pdm -d pdm -c "
            SELECT count(*) AS messages,
                   round(extract(epoch FROM max(created_at) - min(created_at))::numeric, 1) AS seconds,
                   round(count(*) / greatest(extract(epoch FROM max(created_at) - min(created_at)), 0.001)) AS per_second
            FROM monitoring.predictions WHERE source='kafka' AND unit_id BETWEEN 7001 AND 7100"
          rate=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc "
            SELECT round(count(*) / greatest(extract(epoch FROM max(created_at) - min(created_at)), 0.001))
            FROM monitoring.predictions WHERE source='kafka' AND unit_id BETWEEN 7001 AND 7100")
          secs=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc "
            SELECT round(extract(epoch FROM max(created_at) - min(created_at))::numeric, 1)
            FROM monitoring.predictions WHERE source='kafka' AND unit_id BETWEEN 7001 AND 7100")
          echo "Скорость обработки потока: $rate сообщений/с (требование блока 1: не менее 100)"
          echo "::notice title=Kafka: скорость обработки потока::$rate сообщений/с — $n сообщений за $secs с, 2 экземпляра consumer, запись в PostgreSQL + прогноз + Redis"
          test "$rate" -ge 100
          docker compose logs consumer | grep -E "пачка [0-9]+:" | tail -n 3

      - name: Сквозная проверка — качество по потоку совпадает с офлайн-оценкой модели
        run: |
          # прогнозы по 100 тестовым двигателям, прошедшим Kafka -> consumer -> Redis -> модель,
          # сопоставляются с фактическим RUL (как запрос 10 в sql/queries.sql, смещение producer 7000)
          read scored recall fpr <<< $(docker compose exec -T postgres psql -U pdm -d pdm -tA -F ' ' -c "
            WITH s AS (SELECT p.alarm, e.target FROM monitoring.predictions p
                       JOIN enriched.sensor_readings e
                         ON e.dataset = 'test' AND e.unit_id = p.unit_id - 7000 AND e.cycle = p.cycle
                       WHERE p.source = 'kafka' AND p.unit_id BETWEEN 7001 AND 7100)
            SELECT count(*), round(avg(alarm::int) FILTER (WHERE target = 1)::numeric, 4),
                   round(avg(alarm::int) FILTER (WHERE target = 0)::numeric, 4) FROM s")
          offline_recall=$(jq '.test.recall * 10000 | round / 10000' models/final_v2.json)
          offline_fpr=$(jq '.test.fpr * 10000 | round / 10000' models/final_v2.json)
          echo "поток:  строк $scored, Recall $recall, FPR $fpr"
          echo "офлайн (models/final_v2.json): Recall $offline_recall, FPR $offline_fpr"
          echo "::notice title=Сквозная проверка потока::по $scored прогнозам из Kafka Recall $recall, FPR $fpr; офлайн-оценка модели — Recall $offline_recall, FPR $offline_fpr"
          test "$scored" = "13096"
          python3 -c "import sys; a, b, c, d = map(float, sys.argv[1:]); sys.exit(abs(a - b) > 1e-3 or abs(c - d) > 1e-3)" \
            "$recall" "$offline_recall" "$fpr" "$offline_fpr"

      - name: Журнал предсказаний записан в PostgreSQL
        run: |
          sleep 2   # журнал пишется пачками раз в секунду
          n=$(docker compose exec -T postgres psql -U pdm -d pdm -tAc \
              "SELECT count(*) FROM monitoring.predictions WHERE unit_id = 900001")
          echo "Записей в monitoring.predictions: $n"
          test "$n" -ge 1

      - name: Тесты внутри Docker
        run: docker compose --profile test run --rm tests

      - name: Журналы контейнеров (при ошибке)
        if: failure()
        run: |
          # ключевые строки журнала consumer — в аннотации (видны через API без входа в GitHub)
          docker compose logs --no-color consumer | grep -E "ERROR|Error|Traceback|отклонена|пачка [0-9]+:" \
            | tail -n 8 | cut -c1-900 | while IFS= read -r line; do echo "::warning title=consumer::${line}"; done
          docker compose logs --no-color

      - name: Остановка
        if: always()
        run: docker compose --profile test down -v
