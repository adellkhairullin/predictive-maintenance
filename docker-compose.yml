# Запуск всего проекта:  docker compose up --build
# Перед первым запуском:  скопировать .env.example в .env и задать PGPASSWORD.
#
# Сервисы:
#   postgres     — офлайн-хранилище: слои raw, cleaned, enriched, features, реестр признаков, журнал предсказаний
#   redis        — онлайн-хранилище: история двигателей и последние векторы признаков
#   etl          — одноразовая загрузка данных, построение слоёв, справочные данные, реестр признаков
#   feature-sync — одноразовая материализация признаков тестовых двигателей из PostgreSQL в Redis
#   api          — FastAPI, http://localhost:8000/docs (стартует после etl и feature-sync)
#   kafka        — брокер Kafka (KRaft, без ZooKeeper), топик sensor-readings
#   consumer     — Kafka -> PostgreSQL (raw) -> прогноз; смещение фиксируется только после записи в БД
# По запросу:
#   docker compose --profile stream run --rm producer --units 1-5 --rate 20  — симулятор датчиков -> Kafka
#   docker compose --profile test run --rm tests   — все тесты, включая интеграционные с PostgreSQL и Redis
#   docker compose --profile train run --rm train  — переобучение финальной модели

x-db-env: &db-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${PGDATABASE:-pdm}
  PGUSER: ${PGUSER:-pdm}
  PGPASSWORD: ${PGPASSWORD:?Задайте PGPASSWORD в файле .env (шаблон — .env.example)}

x-app: &app
  build:
    context: .
    dockerfile: deployment/Dockerfile
    target: runtime
  image: predictive-maintenance:latest
  environment:
    <<: *db-env

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:-pdm}
      POSTGRES_USER: ${PGUSER:-pdm}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Задайте PGPASSWORD в файле .env (шаблон — .env.example)}
    ports:
      - "5433:5432"    # 5433 снаружи: на компьютере автора порт 5432 занят локальным PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # данные сохраняются на диск и переживают перезапуск
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  etl:
    <<: *app
    command: ["python", "-m", "src.etl_pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  feature-sync:
    <<: *app
    command: ["python", "-m", "src.feature_store.materialize", "--dataset", "test"]
    environment:
      <<: *db-env
      PDM_ONLINE_STORE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      etl:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *db-env
      PDM_MODEL_NAME: ${PDM_MODEL_NAME:-final_v2}
      PDM_PREDICTION_LOG: ${PDM_PREDICTION_LOG:-db}
      PDM_ONLINE_STORE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      feature-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # внутри Docker — kafka:9092, с компьютера — localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # топик создаётся явно (streaming/config.py)
    ports:
      - "29092:29092"
    # сообщения хранятся внутри контейнера: для проекта их не нужно сохранять между пересозданиями
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 15
    restart: unless-stopped

  consumer:
    <<: *app
    command: ["python", "-m", "streaming.consumer"]
    environment:
      <<: *db-env
      KAFKA_BOOTSTRAP: kafka:9092
      PDM_ONLINE_STORE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    restart: unless-stopped

  producer:
    <<: *app
    entrypoint: ["python", "-m", "streaming.producer"]
    command: ["--units", "1-10", "--rate", "50"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["stream"]

  tests:
    <<: *app
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: dev
    image: predictive-maintenance:dev
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379/0
    command: ["pytest", "-v", "-rs", "--cov=src", "--cov=api", "--cov=streaming", "--cov-report=term"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    profiles: ["test"]

  train:
    <<: *app
    command: ["python", "-m", "src.models.train_final"]
    volumes:
      - ./models:/app/models    # обученная модель сохраняется в папку проекта
    depends_on:
      etl:
        condition: service_completed_successfully
    profiles: ["train"]

volumes:
  pgdata:
  redisdata:
